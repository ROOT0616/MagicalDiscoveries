##### Magical Discoveries 2.0 #####
###############################
 situation_md_magical_awakening:0 "Magical Awakening"
 situation_md_magical_awakening_desc:0 "Independent laboratories have reproduced the same phenomenon under conditions that known physics cannot explain. Belief is irrelevant. We must measure it, reproduce it, and eliminate every conventional explanation. If what remains truly deserves the ancient name of magic, we will have to turn it into a part of civilization."
 md_magic_stage_1:0 "Testing Reproducibility"
 md_magic_stage_2:0 "Formalizing the Unknown Field"
 md_magic_stage_3:0 "Matter Manipulation"
 md_magic_stage_4:0 "Reproducing Mithril"
 md_magic_progress_materialist:0 "Materialist Analysis"
 md_magic_progress_spiritualist:0 "Spiritualist Insight"
 md_magic_awakening_complete_tt:0 "A magical civilization will be established. Mithril industrialization, Advanced Magical Science and Advanced Alchemy will be guaranteed research options."
 magical_discoveries.101.name:0 "Impossible Reproducibility"
 magical_discoveries.101.desc:0 "Several laboratories working independently have reproduced the same anomalous phenomenon. Instruments record unmistakable energy transfer, yet neither its source nor its carrier exists within any known interaction.\n\nThe experiment was repeated. The controls were repeated. New instruments and new researchers changed nothing.\n\nOne scientist, half joking, wrote an old word into the report: §Ymagic§!."
 magical_discoveries.101.a:0 "Then we will make magic a science."
 magical_discoveries.101.b:0 "Too dangerous. Freeze the research for ten years."
 magical_discoveries.102.name:0 "Magic, Measured"
 magical_discoveries.102.desc:0 "The first quantitative model of the phenomenon has been completed. The new field cannot be described by input energy alone; its behavior changes with observers, material structure and local spacetime conditions. Yet it can be predicted.\n\n§GTechnology gained:§! §YMagical Science§!\n\nMagical Science is now a legitimate academic discipline."
 magical_discoveries.102.a:0 "Names are secondary to reproducibility. Treat it as a new natural science."
 magical_discoveries.103.name:0 "Interference With Matter"
 magical_discoveries.103.desc:0 "A controlled magical-field experiment has fixed an ordinary element into a crystal structure that should be impossible at these temperatures and pressures. The change is not transient; the structure remains after the field is removed.\n\n§GTechnology gained:§! §YAlchemy§!\n\nThis is no longer merely the observation of magic. It is the engineering of matter through magical law."
 magical_discoveries.103.a:0 "Open the results to academia and industry."
 magical_discoveries.104.name:0 "A Metal That Should Not Exist"
 magical_discoveries.104.desc:0 "After thousands of failures, our alchemical laboratories have reproduced a stable artificial substance. The silver-white metal can hold extraordinary magical density within its structure without collapsing.\n\nBorrowing a name from ancient fiction, the researchers have begun calling it §YMithril§!.\n\n§GDiscovery:§! §YMithril§!\n\nProducing grams in a laboratory and refining it across an empire are different problems. Its industrialization technology will become a guaranteed research option when the Situation is completed."
 magical_discoveries.104.a:0 "Now establish a method for industrial production."
 magical_discoveries.105.name:0 "A Magical Civilization"
 magical_discoveries.105.desc:0 "Only a few years ago, magic was a joke that could end a research career. Now universities maintain departments, industries maintain dedicated divisions, and the military demands application studies.\n\nIn a laboratory vault lies the silver-white sample that symbolizes the transition: Mithril.\n\nWith Chapter I complete, our research departments have submitted three formal programs.\n\n£engineering£ §YMithril Refining§!\n£physics£ §YAdvanced Magical Science§!\n£engineering£ §YAdvanced Alchemy§!\n\nAll three have been added as §Gguaranteed research options§!, not left to the normal random draw."
 magical_discoveries.105.a:0 "Begin the engineering of a new civilization."
 magical_discoveries.111.name:0 "The Book of the Dead"
 magical_discoveries.111.desc:0 "A document of unknown origin has reached our researchers. Its theory treats life, mind and magic as a single system, claiming death itself is merely a boundary condition. It bears one title: the Necronomicon. Once opened, its implications may be impossible to contain."
 magical_discoveries.111.a:0 "Purchase it and break the seal. £energy£3500"
 magical_discoveries.111.b:0 "Some knowledge should remain buried."

 magical_discoveries_crisis.1.name:0 "A Gaze Beyond the Sky"
 magical_discoveries_crisis.1.desc:0 "Soon after analysis of the Necronomicon begins, magical observatories across the galaxy detect faint fluctuations arriving from the same direction. It is not a signal. It feels more like the trace of something observing us."
 magical_discoveries_crisis.1.a:0 "Continue observing."
 magical_discoveries_crisis.2.name:0 "The Silent Boundary"
 magical_discoveries_crisis.2.desc:0 "Several points along the galactic rim now contain phase boundaries inconsistent with normal space. Magical theory indicates they are not natural. Something on the other side is deliberately holding them open."
 magical_discoveries_crisis.2.a:0 "Something is building a door."
 magical_discoveries_crisis.3.name:0 "The Final Warning"
 magical_discoveries_crisis.3.desc:0 "Every magical observatory simultaneously receives the same meaningful pattern. Its translation is simple: 'Abandon forbidden knowledge. Those who defile the order of creation will be judged.' The source lies beyond known space."
 magical_discoveries_crisis.3.a:0 "No outsider will judge our knowledge."
 magical_discoveries_crisis.3.b:0 "Prepare for what is coming."
 magical_discoveries_crisis.8.name:0 "Divine Matter"
 magical_discoveries_crisis.8.desc:0 "Wreckage recovered from a destroyed Heavenly fleet contains stable structures unlike any known material. The invaders may appear supernatural, but their bodies and ships obey laws that can be studied."
 magical_discoveries_crisis.8.a:0 "Analyze this 'skin of the gods'."
 magical_discoveries_crisis.6.name:0 "Even Gods Have Structure"
 magical_discoveries_crisis.6.desc:0 "Analysis proves the Heavenly defenses are not absolute. If the phase of their magical fields can be matched to their material structure, damage should become possible. The next step is turning that principle into a weapon."
 magical_discoveries_crisis.6.a:0 "Begin the anti-divine weapons project."
 magical_discoveries_crisis.7.name:0 "Mythical Decay Theory"
 magical_discoveries_crisis.7.desc:0 "The theory is complete. We can force the protective field surrounding Heavenly entities to collapse and drag them into a state vulnerable to conventional attack. Myth has become reproducible engineering."
 magical_discoveries_crisis.7.a:0 "Then let us shoot down the gods."

