 magical_discoveries_crisis.31.name:0 "A Voice From Before Our Time"
 magical_discoveries_crisis.31.diplomatic_title:0 "ANCIENT TRANSMISSION"
 magical_discoveries_crisis.31.desc:0 "Only weeks after our laboratories begin dissecting the recovered divine matter, a priority transmission arrives from [event_target:md_heaven_fallen_contact.GetName].\n\nThe ancient empire refers to our specimen not as skin, but as a §Ymanifestation shell§!—a structure used by beings from beyond our reality to endure the physical laws of this universe. Their familiarity with the material leaves little doubt: they have encountered its makers before."
 magical_discoveries_crisis.31.a:0 "What do you know about them?"
 magical_discoveries_crisis.31.a.response:0 "§H\"Young ones, that is not flesh. It is a compromise. Their true forms do not belong beneath your stars, so they clothe themselves in laws your universe can tolerate. A shell can be broken. The gate that replaces it is the greater problem.\"§!"
 magical_discoveries_crisis.31.b:0 "Then stand with us against them."
 magical_discoveries_crisis.31.b.response:0 "§H\"Whether we walk the galaxy again is not a decision your request can force upon us. But know this: for the first time in an age, we are watching the borders of our realm with open eyes.\"§!"

 magical_discoveries.102.b:0 "Perhaps the old legends preserved observations of the same phenomenon."
 magical_discoveries.103.b:0 "Keep this strategic technology under state control."
 magical_discoveries.106.name:0 "The Sealed Laboratory"
 magical_discoveries.106.desc:0 "During a field-resonance test, a laboratory room continued operating for several minutes after losing all external power. It then shut down at once, while several materials inside suffered unexplained embrittlement.\n\nNo one died, but the research team warns that every existing safety code assumes conventional physics."
 magical_discoveries.106.a:0 "Rewrite the safety standards from first principles."
 magical_discoveries.106.b:0 "Unknown science carries risks. Do not slow the experiments."
 magical_discoveries.107.name:0 "Folklore and Measurements"
 magical_discoveries.107.desc:0 "Historians report that diagrams from rituals recorded thousands of years ago match modern magical-field stability conditions with statistically significant accuracy.\n\nCoincidence, later alteration, or evidence that someone observed the same phenomenon long before us? We do not yet have enough evidence."
 magical_discoveries.107.a:0 "Reexamine folklore as a possible observational record."
 magical_discoveries.107.b:0 "Use only reproducible modern data."
